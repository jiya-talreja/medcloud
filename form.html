<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedCloud - Sign Up</title>
  <link rel="stylesheet" href="css.css" />
</head>
<body>
  <div class="container">
    <div class="signup-box">
      <div class="form-section">
        <h2>Sign Up For A MedCloud Account</h2>

        <form id="signupForm">
          <div class="input-row">
            <input type="text" id="fname" placeholder="First Name" required />
            <input type="text" id="lname" placeholder="Last Name" required />
          </div>

          <div class="input-row">
            <input type="email" id="email" placeholder="Email" required />
            <input type="text" id="address" placeholder="Address" required />
          </div>

          <div class="input-row">
            <input type="text" id="hospitalId" placeholder="Your Hospital ID" required />
            <input type="number" id="age" placeholder="Age" required />
          </div>

          <div class="input-row">
            <select id="gender" required>
              <option value="">Select Gender</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
            <select id="bloodGroup" required>
              <option value="">Select Blood Group</option>
              <option>A+</option>
              <option>A−</option>
              <option>B+</option>
              <option>B−</option>
              <option>O+</option>
              <option>O−</option>
              <option>AB+</option>
              <option>AB−</option>
            </select>
          </div>

          <textarea id="medicalHistory" placeholder="Brief Medical History (if any)" rows="3"></textarea>
          <textarea id="conditions" placeholder="Existing Health Conditions (e.g. Diabetes, Asthma, etc.)" rows="3"></textarea>

          <div class="input-row">
            <input type="text" id="emergencyContact" placeholder="Emergency Contact Number" required />
            <input type="text" id="insurance" placeholder="Insurance Policy Number (optional)" />
          </div>

          <div class="input-row">
            <input type="password" id="password" placeholder="Create Password" required />
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
          </div>

          <label class="terms">
            <input type="checkbox" id="terms" required /> By creating your account, you accept our 
            <a href="#">Terms & Conditions</a>.
          </label>

          <button type="submit" class="btn">Create Account</button>

        </form>

        <p class="login-text">Already have an account? <a href="1login.html">Login here!</a></p>
        <p id="errorMsg"></p>
      </div>

      <div class="image-section">
        <h3>Let's Make Healthcare Smarter Together!</h3>
        <img src="web_pt_11.png" alt="Doctor" />

        <p>Ping us for any inquiries!</p>
      </div>
    </div>
    <footer>
      <p>© Copyright 2025. MedCloud Pvt. Ltd.</p>
    </footer>
  </div>

  <script src="scriptt.js"></script>
</body>
</html>
